<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闽南语圣经 Hokkien Bible</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c9a84c;--gold-light:#e8c97a;--dark:#1a1208;--cream:#f5edd8;--cream2:#ede0c4;--text-light:#6b5230;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--dark);color:var(--cream);font-family:'Noto Sans SC',sans-serif;min-height:100vh;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(201,168,76,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(139,32,32,.06) 0%,transparent 50%);}

  /* BACK BUTTON */
  .back-bar{padding:12px 20px;border-bottom:1px solid rgba(201,168,76,.1);}
  .back-btn{background:none;border:1px solid rgba(201,168,76,.25);border-radius:8px;color:var(--text-light);padding:7px 14px;font-size:13px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .2s;display:flex;align-items:center;gap:6px;}
  .back-btn:hover{border-color:rgba(201,168,76,.5);color:var(--gold-light);}

  header{text-align:center;padding:28px 20px 20px;border-bottom:1px solid rgba(201,168,76,.2);}
  header::before{content:'✦';display:block;color:var(--gold);font-size:16px;margin-bottom:10px;opacity:.7;}
  header h1{font-family:'Noto Serif SC',serif;font-size:clamp(22px,5vw,36px);font-weight:700;color:var(--gold-light);letter-spacing:4px;}
  header p{font-size:12px;color:var(--text-light);margin-top:6px;letter-spacing:2px;text-transform:uppercase;}

  .app-body{max-width:960px;margin:0 auto;padding:24px 16px 160px;}

  #sc-panel{display:none;margin-bottom:24px;background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.2);border-radius:14px;overflow:hidden;}
  #sc-panel.visible{display:block;}
  .sc-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.06));border-bottom:1px solid rgba(201,168,76,.15);flex-wrap:wrap;gap:8px;}
  .sc-hdr h2{font-family:'Noto Serif SC',serif;color:var(--gold-light);font-size:17px;}
  .sc-hdr span{font-size:11px;color:var(--text-light);letter-spacing:1px;}
  .sc-body{padding:20px;max-height:420px;overflow-y:auto;scroll-behavior:smooth;}
  .sc-body::-webkit-scrollbar{width:4px;}
  .sc-body::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px;}
  .verse{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;}
  .vnum{font-size:11px;color:var(--gold);opacity:.7;min-width:24px;padding-top:4px;font-weight:600;flex-shrink:0;}
  .vtxt{font-family:'Noto Serif SC',serif;font-size:16px;color:var(--cream);line-height:1.9;}
  .info-msg{text-align:center;padding:28px;color:var(--text-light);font-size:13px;line-height:2;}

  .tabs{display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,.03);border-radius:12px;padding:4px;border:1px solid rgba(201,168,76,.15);}
  .tab{flex:1;padding:11px;background:none;border:none;color:var(--text-light);font-family:'Noto Serif SC',serif;font-size:13px;cursor:pointer;border-radius:8px;transition:all .3s;letter-spacing:1px;}
  .tab.active{background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.1));color:var(--gold-light);border:1px solid rgba(201,168,76,.3);}
  .tab:hover:not(.active){background:rgba(255,255,255,.04);color:var(--cream);}

  .bsec{display:none;}.bsec.active{display:block;}
  .slbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.6;margin:16px 0 8px;}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;margin-bottom:12px;}
  .bbtn{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.12);border-radius:8px;padding:9px 6px;color:var(--cream2);font-size:12px;cursor:pointer;transition:all .25s;text-align:center;}
  .bbtn:hover{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.35);color:var(--gold-light);transform:translateY(-1px);}
  .bbtn.sel{background:linear-gradient(135deg,rgba(201,168,76,.25),rgba(201,168,76,.12));border-color:rgba(201,168,76,.5);color:var(--gold-light);}

  .cpanel{display:none;margin-top:20px;background:rgba(255,255,255,.02);border:1px solid rgba(201,168,76,.15);border-radius:12px;padding:18px;}
  .cpanel.visible{display:block;}
  .cpanel h3{font-family:'Noto Serif SC',serif;color:var(--gold-light);font-size:15px;margin-bottom:4px;}
  .cpanel p{font-size:11px;color:var(--text-light);margin-bottom:14px;}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;}
  .cbtn{background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.12);border-radius:6px;padding:9px 4px;color:var(--cream2);font-size:13px;cursor:pointer;transition:all .2s;text-align:center;}
  .cbtn:hover{background:rgba(201,168,76,.15);border-color:rgba(201,168,76,.4);color:var(--gold-light);}
  .cbtn.playing{background:linear-gradient(135deg,rgba(201,168,76,.3),rgba(201,168,76,.15));border-color:var(--gold);color:var(--gold-light);}

  #pbar{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(12,8,2,.97);border-top:1px solid rgba(201,168,76,.25);backdrop-filter:blur(20px);z-index:100;min-height:95px;max-height:70vh;overflow:hidden;}
  #pbar.visible{display:block;}
  .dragbar{width:100%;height:22px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,.04);border-bottom:1px solid rgba(201,168,76,.1);touch-action:none;user-select:none;}
  .dragbar::before{content:'';width:44px;height:4px;background:rgba(201,168,76,.35);border-radius:2px;transition:background .2s;}
  .dragbar:hover::before{background:rgba(201,168,76,.7);}
  .pinner{padding:12px 20px 14px;max-width:960px;margin:0 auto;}
  .ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .ptitle{font-family:'Noto Serif SC',serif;color:var(--gold-light);font-size:15px;font-weight:600;}
  .psub{font-size:10px;color:var(--text-light);margin-top:2px;letter-spacing:1px;}
  .xbtn{background:none;border:1px solid rgba(201,168,76,.2);border-radius:6px;color:var(--text-light);padding:6px 10px;cursor:pointer;font-size:14px;transition:all .2s;}
  .xbtn:hover{border-color:rgba(201,168,76,.5);color:var(--gold-light);}
  #aplayer{width:100%;height:38px;accent-color:var(--gold);border-radius:8px;display:block;}
  .anote{font-size:10px;color:rgba(201,168,76,.4);text-align:center;margin-top:6px;letter-spacing:1px;}

  @media(max-width:480px){.bgrid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));}.cgrid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));}.sc-body{max-height:300px;}.vtxt{font-size:15px;}}
</style>
</head>
<body>

<div class="back-bar">
  <button class="back-btn" onclick="window.location.href='/'">← 返回灵修app</button>
</div>

<header>
  <h1>闽南语圣经</h1>
  <p>Hokkien Bible · 和合本经文对照</p>
</header>

<div class="app-body">
  <div id="sc-panel">
    <div class="sc-hdr">
      <div><h2 id="sc-title">—</h2><span>和合本 · Chinese Union Version</span></div>
    </div>
    <div class="sc-body" id="sc-body"><div class="info-msg">请选择书卷和章节开始阅读</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showT('ot')">旧约 Old Testament</button>
    <button class="tab" onclick="showT('nt')">新约 New Testament</button>
  </div>

  <div class="bsec active" id="ot-sec">
    <div class="slbl">律法书 Torah</div><div class="bgrid" id="ot-law"></div>
    <div class="slbl">历史书 History</div><div class="bgrid" id="ot-hist"></div>
    <div class="slbl">诗歌书 Poetry</div><div class="bgrid" id="ot-poet"></div>
    <div class="slbl">先知书 Prophets</div><div class="bgrid" id="ot-prop"></div>
  </div>
  <div class="bsec" id="nt-sec">
    <div class="slbl">四福音书 Gospels</div><div class="bgrid" id="nt-gosp"></div>
    <div class="slbl">使徒行传 Acts</div><div class="bgrid" id="nt-acts"></div>
    <div class="slbl">保罗书信 Paul's Letters</div><div class="bgrid" id="nt-paul"></div>
    <div class="slbl">普通书信 General Letters</div><div class="bgrid" id="nt-gen"></div>
    <div class="slbl">启示录 Revelation</div><div class="bgrid" id="nt-rev"></div>
  </div>

  <div class="cpanel" id="cpanel">
    <h3 id="cp-title"></h3><p id="cp-sub"></p>
    <div class="cgrid" id="cgrid"></div>
  </div>
</div>

<div id="pbar">
  <div class="dragbar" id="dragbar"></div>
  <div class="pinner">
    <div class="ptop">
      <div><div class="ptitle" id="ptitle">—</div><div class="psub">闽南语圣经 · Hokkien Bible</div></div>
      <button class="xbtn" onclick="closeP()">✕</button>
    </div>
    <audio id="aplayer" controls></audio>
    <div class="anote" id="anote">选择章节后自动播放</div>
  </div>
</div>

<script>
// [简体名, 文件前缀(简体,匹配Hokkien-bible文件名), 章数, Bible API ID]
const B={
  'ot-law':[['创世记','01创世记',50,'GEN'],['出埃及记','02出埃及记',40,'EXO'],['利未记','03利未记',27,'LEV'],['民数记','04民数记',36,'NUM'],['申命记','05申命记',34,'DEU']],
  'ot-hist':[['约书亚记','06约书亚记',24,'JOS'],['士师记','07士师记',21,'JDG'],['路得记','08路得记',4,'RUT'],['撒母耳记上','09撒母耳记上',31,'1SA'],['撒母耳记下','10撒母耳记下',24,'2SA'],['列王纪上','11列王纪上',22,'1KI'],['列王纪下','12列王纪下',25,'2KI'],['历代志上','13历代志上',29,'1CH'],['历代志下','14历代志下',36,'2CH'],['以斯拉记','15以斯拉记',10,'EZR'],['尼希米记','16尼希米记',13,'NEH'],['以斯帖记','17以斯帖记',10,'EST']],
  'ot-poet':[['约伯记','18约伯记',42,'JOB'],['诗篇','19诗篇',150,'PSA'],['箴言','20箴言',31,'PRO'],['传道书','21传道书',12,'ECC'],['雅歌','22雅歌',8,'SNG']],
  'ot-prop':[['以赛亚书','23以赛亚书',66,'ISA'],['耶利米书','24耶利米书',52,'JER'],['耶利米哀歌','25耶利米哀歌',5,'LAM'],['以西结书','26以西结书',48,'EZK'],['但以理书','27但以理书',12,'DAN'],['何西阿书','28何西阿书',14,'HOS'],['约珥书','29约珥书',3,'JOL'],['阿摩司书','30阿摩司书',9,'AMO'],['俄巴底亚书','31俄巴底亚书',1,'OBA'],['约拿书','32约拿书',4,'JON'],['弥迦书','33弥迦书',7,'MIC'],['那鸿书','34那鸿书',3,'NAM'],['哈巴谷书','35哈巴谷书',3,'HAB'],['西番雅书','36西番雅书',3,'ZEP'],['哈该书','37哈该书',2,'HAG'],['撒迦利亚书','38撒迦利亚书',14,'ZEC'],['玛拉基书','39玛拉基书',4,'MAL']],
  'nt-gosp':[['马太福音','40马太福音',28,'MAT'],['马可福音','41马可福音',16,'MRK'],['路加福音','42路加福音',24,'LUK'],['约翰福音','43约翰福音',21,'JHN']],
  'nt-acts':[['使徒行传','44使徒行传',28,'ACT']],
  'nt-paul':[['罗马书','45罗马书',16,'ROM'],['哥林多前书','46哥林多前书',16,'1CO'],['哥林多后书','47哥林多后书',13,'2CO'],['加拉太书','48加拉太书',6,'GAL'],['以弗所书','49以弗所书',6,'EPH'],['腓立比书','50腓立比书',4,'PHP'],['歌罗西书','51歌罗西书',4,'COL'],['帖撒罗尼迦前书','52帖撒罗尼迦前书',5,'1TH'],['帖撒罗尼迦后书','53帖撒罗尼迦后书',3,'2TH'],['提摩太前书','54提摩太前书',6,'1TI'],['提摩太后书','55提摩太后书',4,'2TI'],['提多书','56提多书',3,'TIT'],['腓利门书','57腓利门书',1,'PHM']],
  'nt-gen':[['希伯来书','58希伯来书',13,'HEB'],['雅各书','59雅各书',5,'JAS'],['彼得前书','60彼得前书',5,'1PE'],['彼得后书','61彼得后书',3,'2PE'],['约翰一书','62约翰一书',5,'1JN'],['约翰二书','63约翰二书',1,'2JN'],['约翰三书','64约翰三书',1,'3JN'],['犹大书','65犹大书',1,'JUD']],
  'nt-rev':[['启示录','66启示录',22,'REV']]
};

Object.entries(B).forEach(([gid,list])=>{
  const g=document.getElementById(gid);if(!g)return;
  list.forEach(([name,prefix,chs,api])=>{
    const b=document.createElement('button');
    b.className='bbtn';b.textContent=name;
    b.onclick=()=>selBook(name,prefix,chs,api,b);
    g.appendChild(b);
  });
});

function showT(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(t==='ot'&&i===0)||(t==='nt'&&i===1)));
  document.getElementById('ot-sec').classList.toggle('active',t==='ot');
  document.getElementById('nt-sec').classList.toggle('active',t==='nt');
  document.getElementById('cpanel').classList.remove('visible');
  document.querySelectorAll('.bbtn').forEach(b=>b.classList.remove('sel'));
}

function selBook(name,prefix,chs,api,btn){
  document.querySelectorAll('.bbtn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('cp-title').textContent=name;
  document.getElementById('cp-sub').textContent=`共 ${chs} 章`;
  const panel=document.getElementById('cpanel');
  panel.classList.add('visible');
  const grid=document.getElementById('cgrid');
  grid.innerHTML='';
  for(let i=1;i<=chs;i++){
    const b2=document.createElement('button');
    b2.className='cbtn';b2.textContent=i;
    b2.onclick=()=>selChapter(name,prefix,i,api,b2);
    grid.appendChild(b2);
  }
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function selChapter(name,prefix,ch,api,btn){
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('playing'));
  btn.classList.add('playing');

  document.getElementById('ptitle').textContent=`${name} 第${ch}章`;
  document.getElementById('pbar').classList.add('visible');
  document.getElementById('anote').textContent='正在加载音频…';

  // Fetch audio URL from our secure backend
  const chPad=String(ch).padStart(3,'0');
  const searchPrefix=`${prefix}_${chPad}`;
  try{
    const r=await fetch(`/api/hokkien-audio?prefix=${encodeURIComponent(searchPrefix)}`);
    const data=await r.json();
    const audio=document.getElementById('aplayer');
    if(data.url){
      audio.src=data.url;
      audio.load();
      audio.play().catch(()=>{});
      document.getElementById('anote').textContent='闽南语朗读 · Hokkien Audio';
    } else {
      audio.src='';
      document.getElementById('anote').textContent='此章节暂无音频';
    }
  }catch{
    document.getElementById('anote').textContent='音频加载失败，请重试';
  }

  // Load scripture
  document.getElementById('sc-title').textContent=`${name} 第${ch}章`;
  document.getElementById('sc-panel').classList.add('visible');
  document.getElementById('sc-body').innerHTML='<div class="info-msg">正在加载经文…</div>';
  window.scrollTo({top:0,behavior:'smooth'});
  loadScripture(api,ch);
}

async function loadScripture(api,ch){
  const body=document.getElementById('sc-body');
  try{
    const res=await fetch(`/api/scripture?book=${api}&chapter=${ch}`);
    if(!res.ok)throw new Error();
    const data=await res.json();
    if(!data.verses||!data.verses.length)throw new Error();
    body.innerHTML='';
    data.verses.forEach(v=>{
      const d=document.createElement('div');
      d.className='verse';
      d.innerHTML=`<span class="vnum">${v.verse}</span><span class="vtxt">${v.text.trim()}</span>`;
      body.appendChild(d);
    });
  }catch{
    body.innerHTML='<div class="info-msg">经文暂时无法加载，请检查网络后重试</div>';
  }
}

function closeP(){
  const a=document.getElementById('aplayer');
  a.pause();a.src='';
  document.getElementById('pbar').classList.remove('visible');
  document.getElementById('sc-panel').classList.remove('visible');
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('playing'));
}

// Drag to resize player
const bar=document.getElementById('pbar');
const handle=document.getElementById('dragbar');
let drag=false,startY=0,startH=0;
handle.addEventListener('mousedown',e=>{drag=true;startY=e.clientY;startH=bar.offsetHeight;document.body.style.userSelect='none';});
handle.addEventListener('touchstart',e=>{drag=true;startY=e.touches[0].clientY;startH=bar.offsetHeight;},{passive:true});
document.addEventListener('mousemove',e=>{if(!drag)return;const h=Math.min(Math.max(startH+(startY-e.clientY),95),window.innerHeight*.75);bar.style.height=h+'px';});
document.addEventListener('touchmove',e=>{if(!drag)return;const h=Math.min(Math.max(startH+(startY-e.touches[0].clientY),95),window.innerHeight*.75);bar.style.height=h+'px';},{passive:true});
document.addEventListener('mouseup',()=>{drag=false;document.body.style.userSelect='';});
document.addEventListener('touchend',()=>{drag=false;});
</script>
</body>
</html>
